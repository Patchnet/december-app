<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>December</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<script>document.documentElement.dataset.theme = localStorage.getItem('dec-theme') || 'light'</script>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell" id="shell">
    <div class="settings-backdrop" id="settings-backdrop" hidden></div>
    <section class="settings-pop" id="settings-pop" role="dialog" aria-modal="true" aria-labelledby="settings-title" tabindex="-1" hidden>
      <h2 class="settings-title" id="settings-title">Settings</h2>

      <div class="set-list">
        <div class="set-row">
          <span class="set-label">Appearance</span>
          <div class="seg" id="theme-seg" role="radiogroup" aria-label="Appearance">
            <button type="button" data-theme-set="light" role="radio" aria-checked="false">light</button>
            <button type="button" data-theme-set="dark" role="radio" aria-checked="false">dark</button>
          </div>
        </div>
        <div class="set-row">
          <span class="set-label">Engine</span>
          <div class="seg" id="engine-seg" role="radiogroup" aria-label="Organizing engine"></div>
        </div>
        <label class="set-row" for="model-input">
          <span class="set-label">Model</span>
          <input class="set-input" id="model-input" placeholder="engine default" spellcheck="false" autocomplete="off" />
        </label>
        <label class="set-row" for="claude-path">
          <span class="set-label">Claude path</span>
          <input class="set-input set-path" id="claude-path" placeholder="auto-detect" spellcheck="false" autocomplete="off" />
        </label>
        <label class="set-row" for="codex-path">
          <span class="set-label">Codex path</span>
          <input class="set-input set-path" id="codex-path" placeholder="auto-detect" spellcheck="false" autocomplete="off" />
        </label>
      </div>

      <a class="settings-about" href="https://github.com/Patchnet/december-app" target="_blank" rel="noopener noreferrer"
        aria-label="About December on GitHub (opens in a new tab)">
        <span class="about-copy">
          <strong>About December <span class="about-version" id="about-version"></span></strong>
          <span class="about-note" aria-hidden="true">
            <span class="about-note-rest">takes you to GitHub</span>
            <span class="about-note-hover">made with love by Patchnet AI</span>
          </span>
        </span>
        <span class="about-arrow" aria-hidden="true">↗</span>
      </a>
    </section>

    <div class="dropzone" id="dropzone" hidden>drop to add to your page</div>

    <section class="onboarding" id="onboarding" hidden aria-labelledby="onboarding-title">
      <button class="onboarding-close" id="onboarding-close" aria-label="Close setup">&times;</button>
      <h2 id="onboarding-title">Make December yours</h2>
      <p>Your page stays local. Choose a CLI you already use, signed in with your own subscription. No API key is needed.</p>
      <div class="onboarding-engines" id="onboarding-engines"></div>
      <div class="onboarding-note" id="onboarding-note"></div>
    </section>

    <h1 class="dateline" id="dateline" tabindex="0" role="button" aria-label="Open the year"></h1>

    <div class="stage" id="stage" data-mode="idle">
      <div class="cwrap">
        <textarea class="capture" id="capture" rows="1"
          placeholder="What's up?" autofocus spellcheck="false"></textarea>
        <span class="enter-hint" id="enter-hint" aria-hidden="true">&#8629;</span>
      </div>

      <!-- One region, one job at a time: the question, what is settling, or
           what needs you today. While you write, it clears for you. The
           cards below never move because this never changes height. -->
      <div class="moment">
        <div class="pane pane-ask">
          <div id="ask"></div>
        </div>
        <div class="pane pane-settling">
          <div class="inbox" id="inbox"></div>
          <div class="activity" id="activity" aria-live="polite"></div>
        </div>
        <div class="pane pane-idle">
          <div class="co-nudge" id="co-nudge"></div>
          <div class="chips" id="suggest"></div>
          <div class="today" id="today" aria-live="polite" aria-label="Today"></div>
          <div class="hint" id="hint"></div>
        </div>
      </div>
    </div>

    <header class="corner">
      <div class="search-wrap">
        <input class="search" id="search" placeholder="find" autocomplete="off" spellcheck="false" />
        <div class="search-results" id="search-results"></div>
      </div>
      <button class="theme-toggle" id="gear-toggle" aria-label="Settings" aria-expanded="false" aria-controls="settings-pop">
        <svg class="gear" viewBox="0 0 14 14" aria-hidden="true">
          <path d="M2 4.6h1.5 M7.5 4.6H12 M2 9.4h4.5 M10.5 9.4H12" />
          <circle cx="5.5" cy="4.6" r="1.6" />
          <circle cx="8.5" cy="9.4" r="1.6" />
        </svg>
      </button>
    </header>

    <div class="body-grid">
      <nav class="rail" id="rail" aria-label="Spaces"></nav>
      <main class="spaces" id="spaces"></main>
    </div>

    <section class="resting" id="resting" aria-label="Quiet spaces"></section>
  </div>

  <div id="focus"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
