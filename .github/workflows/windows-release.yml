name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run canonical suite
        run: npm test

      - name: Verify release tag matches package version
        run: node scripts/check-release-tag.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Publish unsigned Windows installer
        run: npm run dist:win:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish updater metadata deterministically
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path -LiteralPath 'release/latest.yml')) {
            throw 'electron-builder did not create release/latest.yml'
          }
          gh release upload '${{ github.ref_name }}' 'release/latest.yml' --clobber

      - name: Verify published release assets
        run: node scripts/verify-release-assets.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
