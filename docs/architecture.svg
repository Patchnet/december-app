<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#287799" stroke-width="1.5"/></marker></defs><rect width="1200" height="1080" fill="#faf9f5"/><style>text{font-family:Arial,sans-serif;fill:#252724}.title{font-family:Georgia,serif;font-size:38px}.head{font-size:19px;font-weight:600}.body{font-size:15px;fill:#59635f}.line{fill:none;stroke:#287799;stroke-width:2;marker-end:url(#arrow)}</style><text x="48" y="62" class="title">December · from a thought to saved work</text><text x="48" y="95" class="body">Local engine, bounded Jev interpretation, shared persistence. Experimental integration · September 20, 2026</text><rect x="48" y="130" width="325" height="105" rx="14" fill="#ffffff" stroke="#d9dfda"/><text x="68" y="162" class="head">1. Capture</text><text x="68" y="189" class="body">Browser / desktop → local HTTP</text><text x="68" y="211" class="body">Capture saved to the inbox</text><rect x="425" y="130" width="340" height="105" rx="14" fill="#ffffff" stroke="#d9dfda"/><text x="445" y="162" class="head">2. Settle scheduler</text><text x="445" y="189" class="body">One active pass; ordered inbox</text><text x="445" y="211" class="body">Eligible fast queue skips batching</text><rect x="817" y="130" width="335" height="105" rx="14" fill="#eff4f1" stroke="#d9dfda"/><text x="837" y="162" class="head">Private server configuration</text><text x="837" y="189" class="body">Own TypeSafe key + CLI sign-in</text><text x="837" y="211" class="body">No key exposed to the browser</text><path d="M373 180 H420" class="line"/><path d="M595 235 V280" class="line"/><rect x="245" y="285" width="705" height="112" rx="14" fill="#edf5f8" stroke="#d9dfda"/><text x="265" y="317" class="head">3. Local eligibility + bounded request</text><text x="265" y="344" class="body">Explicit additions / named checklists only; context and duplicate checks</text><text x="265" y="366" class="body">Capture and limited list/name context go to Jev. Everything else defers.</text><path d="M435 397 V435" class="line"/><path d="M950 340 H1075 V620" class="line"/><rect x="48" y="440" width="630" height="150" rx="14" fill="#edf5f8" stroke="#d9dfda"/><text x="68" y="472" class="head">4. Jev + local validation</text><text x="68" y="499" class="body">Pinned jev-1.13.0 · 1.2s timeout · no automatic retry</text><text x="68" y="521" class="body">Check response, confidence, exact action agreement and current revision</text><text x="68" y="543" class="body">Failures / ambiguity / changed state → organizer; shadow mode never writes</text><rect x="758" y="625" width="394" height="132" rx="14" fill="#ffffff" stroke="#d9dfda"/><text x="778" y="657" class="head">Organizer fallback</text><text x="778" y="684" class="body">Claude Code or Codex CLI</text><text x="778" y="706" class="body">Broader work, clarification and recovery</text><text x="778" y="728" class="body">Uses December tools, not direct state edits</text><path d="M678 513 H760 V620" class="line"/><path d="M350 590 V625" class="line"/><rect x="48" y="625" width="630" height="132" rx="14" fill="#ffffff" stroke="#d9dfda"/><text x="68" y="657" class="head">5. Fixed action → shared tool surface</text><text x="68" y="684" class="body">Accepted Jev decision maps to an allowlisted action</text><text x="68" y="706" class="body">Save through ordinary tools, then file the capture</text><text x="68" y="728" class="body">Core, receipts and undo remain authoritative</text><path d="M955 757 V794 H625" class="line"/><path d="M360 757 V795" class="line"/><rect x="48" y="800" width="580" height="115" rx="14" fill="#ffffff" stroke="#d9dfda"/><text x="68" y="832" class="head">6. Durable local work</text><text x="68" y="859" class="body">Atomic state snapshots · yearly event log</text><text x="68" y="881" class="body">Operation receipts · partial-write recovery · scoped undo</text><rect x="710" y="800" width="442" height="115" rx="14" fill="#ffffff" stroke="#d9dfda"/><text x="730" y="832" class="head">7. State refresh → visible feedback</text><text x="730" y="859" class="body">SSE invalidation + polling backup</text><text x="730" y="881" class="body">Keyed cards, rows and rail stay stable</text><path d="M628 855 H705" class="line"/><path d="M930 915 V955" class="line"/><rect x="48" y="960" width="1104" height="80" rx="14" fill="#ffffff" stroke="#d9dfda"/><text x="68" y="992" class="head">Presentation has its own clock</text><text x="68" y="1019" class="body">Yarn → painted growing card → text reveal / one new-card landing. Edits stay local; completion checks, strikes, then collapses.</text></svg>